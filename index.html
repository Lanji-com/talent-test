const optionLabels = ["非常符合","比较符合","一般 / 不确定","不太符合","完全不符合"];
const optionScores = [5,4,3,2,1];
const categories = ["语言","逻辑","空间","动觉","音乐","人际","内省","自然"];
let shuffled = [], currentIndex = 0, answers = [];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startTest() {
  shuffled = shuffle([...questions]);
  currentIndex = 0;
  answers = [];
  document.getElementById('start').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = shuffled[currentIndex];
  document.getElementById('currentNum').textContent = currentIndex + 1;
  document.getElementById('questionText').textContent = q.t;
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  optionLabels.forEach((label, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = label;
    btn.onclick = () => selectOption(idx);
    optionsDiv.appendChild(btn);
  });
}

function selectOption(optIdx) {
  const q = shuffled[currentIndex];
  answers.push({ c: q.c, score: optionScores[optIdx] });
  currentIndex++;
  if (currentIndex < shuffled.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  const totals = {};
  categories.forEach(c => totals[c] = 0);
  answers.forEach(a => { totals[a.c] += a.score; });
  const results = categories.map(c => {
    const total = totals[c];
    const percent = Math.round(total / 75 * 100);
    return { c, total, percent };
  });
  results.sort((a,b) => b.percent - a.percent);
  const scoresDiv = document.getElementById('scores');
  scoresDiv.innerHTML = '';
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'score-item';
    div.innerHTML = `<div class="score-label">${r.c}天赋</div>
      <div class="score-bar"><div class="score-fill" style="width:${r.percent}%"></div></div>
      <div class="score-text">${r.percent}% (${r.total}/75)</div>`;
    scoresDiv.appendChild(div);
  });
  const top3 = results.slice(0,3);
  const top3Div = document.getElementById('top3');
  top3Div.innerHTML = `<h2>你的优势天赋</h2>
    <p>1. ${top3[0].c}天赋 ${top3[0].percent}%</p>
    <p>2. ${top3[1].c}天赋 ${top3[1].percent}%</p>
    <p>3. ${top3[2].c}天赋 ${top3[2].percent}%</p>
    <p class="note">说明：本测试结果仅供参考，你的突出优势是前几项天赋。</p>`;
}
